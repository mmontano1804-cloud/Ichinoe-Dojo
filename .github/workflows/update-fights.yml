name: Update fight list

on:
  push:
    paths:
      - 'fights/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build fight list
        shell: python
        run: |
          import json
          from pathlib import Path

          allowed = {'.mp4', '.webm', '.ogg'}
          folder = Path('fights')
          files = [
              p.as_posix()
              for p in folder.iterdir()
              if p.is_file() and p.suffix.lower() in allowed
          ] if folder.exists() else []

          files.sort(key=lambda s: s.lower())
          Path('fight-files.json').write_text(
              json.dumps(files, indent=2, ensure_ascii=False),
              encoding='utf-8'
          )

      - name: Save fight list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fight-files.json
          git diff --cached --quiet || git commit -m "Update fight list"
          git push

